backend:
  name: github
  repo: KisanthK/2379-cadets
  branch: main
  base_url: https://kisanthk-90.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "schedule"
    label: "Training Schedule"
    files:
      - name: "schedule"
        label: "Training Schedule"
        file: "data/schedule.json"
        fields:
          - { label: "Training Day", name: "trainingDay", widget: "string" }
          - { label: "Training Time", name: "trainingTime", widget: "string" }
          - { label: "Address Line 1", name: "addressLine1", widget: "string" }
          - { label: "Address Line 2", name: "addressLine2", widget: "string" }
          - { label: "Entrance Instructions", name: "entranceNoteHtml", widget: "text" }

  - name: "sponsors"
    label: "Sponsors"
    files:
      - name: "sponsors"
        label: "Sponsors List"
        file: "data/sponsors.json"
        fields:
          - label: "Primary Sponsors"
            name: "primary"
            widget: "list"
            fields:
              - { label: "Logo filename", name: "img", widget: "string" }
              - { label: "Alt text", name: "alt", widget: "string" }
              - { label: "Website URL", name: "href", widget: "string", required: false }
              - { label: "Accessible label", name: "ariaLabel", widget: "string", required: false }
          - label: "Secondary Sponsors"
            name: "secondary"
            widget: "list"
            fields:
              - { label: "Logo filename", name: "img", widget: "string" }
              - { label: "Alt text", name: "alt", widget: "string" }
              - { label: "Website URL", name: "href", widget: "string", required: false }
              - { label: "Accessible label", name: "ariaLabel", widget: "string", required: false }
